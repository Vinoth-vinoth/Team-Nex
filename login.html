<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Intelligent Timetable Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 90%);
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: min(440px, 100%);
      background: var(--card-bg);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .demo-pills {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin: 20px 0;
    }

    .demo-pills span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .pills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pill-btn {
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .pill-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #2563eb;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .alert {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="login-box">
    <div class="header">
      <div class="icon">📅</div>
      <div>
        <h2>Sign In</h2>
        <p>Intelligent Timetable Management</p>
      </div>
    </div>

    <div class="demo-pills">
      <span>Quick Demo Accounts</span>
      <div class="pills-grid">
        <button class="pill-btn" onclick="fill('admin@college.com', 'admin123')">👑 Admin</button>
        <button class="pill-btn" onclick="fill('staff@college.com', 'staff123')">👨‍🏫 Staff</button>
        <button class="pill-btn" onclick="fill('student@college.com', 'student123')">🎓 Student</button>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" value="admin@college.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" value="admin123" required />
      </div>
      <button type="submit" class="submit-btn" id="btnSubmit">Sign In →</button>
    </form>

    <div id="alertBox" class="alert"></div>

    <a href="index.html" class="back-link">← Return to Main Portal</a>
  </div>

  <script>
    function fill(e, p) {
      document.getElementById('email').value = e;
      document.getElementById('password').value = p;
      document.getElementById('alertBox').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('alertBox');

      btn.innerText = 'Authenticating...';
      btn.disabled = true;
      alertBox.style.display = 'none';

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        alertBox.className = 'alert alert-success';
        alertBox.innerText = `Welcome, ${data.user.name} (${data.user.role})! Redirecting...`;
        alertBox.style.display = 'block';

        setTimeout(() => {
          if (data.user.role === 'STUDENT') {
            window.location.href = 'student.html';
          } else {
            window.location.href = 'http://localhost:5173';
          }
        }, 1000);
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.innerText = err.message;
        alertBox.style.display = 'block';
        btn.innerText = 'Sign In →';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
